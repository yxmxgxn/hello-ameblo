name: Crawl

# 起動は毎時 Cloudflare の Worker(Cron Triggers)が workflow_dispatch で行う。
# GitHub の schedule は混雑時に遅れたり飛ばされたりしたのでやめた。手動実行もここから。
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 実行時間の上限(分)
        default: "50"
      blogs:
        description: このブログだけ(カンマ区切り。空なら全部)
        default: ""

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl
        env:
          CRAWL_API: ${{ vars.CRAWL_API }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
        run: |
          python crawler/crawl.py \
            --minutes "${{ inputs.minutes || '50' }}" \
            ${{ inputs.blogs && format('--blogs "{0}"', inputs.blogs) || '' }}
