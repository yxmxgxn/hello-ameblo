<body>
<header class="site-head wide">
  <h1><a href="/">ハロプロ アメブロ検索</a></h1>
  <p class="lead">その日に書かれたブログを一覧で。</p>
  <p class="lead sec"><a href="/">本文から探す</a> ｜ <a href="/about">このサイトについて</a></p>
</header>

<main class="wide">
  <form id="dayform" class="daybar" autocomplete="off">
    <button id="prev" type="button" class="ghost" aria-label="前の日">◀</button>
    <input id="date" type="date" aria-label="日付">
    <button id="next" type="button" class="ghost" aria-label="次の日">▶</button>
    <button id="today" type="button" class="ghost">今日</button>
  </form>

  <div class="daygrid">
    <nav id="gnav" class="gnav" aria-label="グループで絞る"></nav>
    <section>
      <p id="status" class="status" aria-live="polite"></p>
      <ol id="results" class="results"></ol>
    </section>
  </div>
</main>
