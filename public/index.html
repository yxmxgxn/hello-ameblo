<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>アメブロ検索</title>
<meta name="description" content="ハロー！プロジェクトのメンバーのアメブロを本文から検索。メンバーで絞り込み、一致した箇所の前後を見て元記事へ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-head">
  <h1><a href="/">アメブロ検索</a></h1>
  <p class="lead">ハロプロメンバーのアメブロを、本文から探せます。</p>
  <p class="lead sec"><a href="/about.html">このサイトについて</a></p>
</header>

<main>
  <form id="f" class="search" role="search" autocomplete="off">
    <div class="q-row">
      <input id="q" name="q" type="search" placeholder="本文から探す（空のままなら新着）" aria-label="検索語" enterkeyhint="search">
      <button type="submit">検索</button>
    </div>

    <div class="opts">
      <button id="pick-open" class="pick-open" type="button" aria-expanded="false" aria-controls="panel">
        <span id="pick-label">メンバー選択</span>
      </button>
      <label class="chk"><input id="act" type="checkbox" checked>ハロプロ現役のみ</label>
      <label>並び
        <select id="order" name="order">
          <option value="">新しい順</option>
          <option value="old">古い順</option>
        </select>
      </label>
    </div>

    <div id="chips" class="chips" hidden></div>

    <!-- メンバー選択パネル。グループを押すとその中の全員が入る -->
    <div id="panel" class="panel" hidden>
      <div class="panel-h">
        <input id="msearch" type="search" placeholder="名前で絞る" aria-label="メンバーを名前で絞る">
        <button id="pick-sort" type="button" class="ghost" aria-pressed="false">あいうえお順</button>
        <button id="pick-clear" type="button" class="ghost">すべて外す</button>
        <button id="pick-close" type="button" class="ghost">閉じる</button>
      </div>
      <div class="panel-sec">
        <h3>グループ</h3>
        <div id="glist" class="taglist"></div>
      </div>
      <div class="panel-sec">
        <h3>メンバー <span id="mcount" class="cnt"></span></h3>
        <div id="mlist" class="taglist"></div>
      </div>
    </div>

    <p class="hint">空白で区切ると「全部含む」記事を探します。検索語を入れずにメンバーだけ選ぶと、その人たちの記事が新しい順に並びます。</p>
  </form>

  <section id="cal" class="cal" hidden aria-label="日付で見る">
    <h2 class="cal-h">日付で見る <span class="cal-note">濃いほど投稿が多い月</span></h2>
    <div id="years" class="years"></div>
    <div id="month" class="month" hidden></div>
  </section>

  <p id="period" class="period" hidden><span id="period-t"></span><button id="period-x" type="button" aria-label="期間の指定を外す">×</button></p>
  <p id="status" class="status" aria-live="polite"></p>
  <ol id="results" class="results"></ol>
  <button id="more" class="more" type="button" hidden>もっと見る</button>
</main>

<footer class="site-foot">
  <p id="stats"></p>
  <p>本文はこのサイトには表示しません。記事は Ameba ブログ（ameblo.jp）でお読みください。</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
